<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎂 给小寿星的生日祝福</title>
<style>
/* ============ 可爱生日页 · 全局 ============ */
:root {
  --pink: #ff8fb1;
  --pink-soft: #ffd6e0;
  --cream: #fff6f0;
  --mint: #a8e6cf;
  --sky: #aec6f5;
  --lilac: #d5b8f5;
  --lemon: #ffe9a0;
  --ink: #6b5566;
  --accent: var(--pink);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Quicksand", sans-serif;
  color: var(--ink);
  background: linear-gradient(160deg, #ffe9f0 0%, #fff6ec 45%, #eafaf3 100%);
  background-size: 200% 200%;
  animation: bgFloat 16s ease-in-out infinite;
  user-select: none;
}
@keyframes bgFloat {
  0%, 100% { background-position: 0% 30%; }
  50% { background-position: 100% 70%; }
}

/* ============ 漂浮装饰 ============ */
.decor { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.decor span {
  position: absolute; opacity: .8; will-change: transform;
  animation: floatUp var(--dur, 9s) ease-in-out infinite;
  animation-delay: var(--delay, 0s);
  font-size: var(--size, 28px);
}
@keyframes floatUp {
  0%, 100% { transform: translateY(0) rotate(-6deg); }
  50% { transform: translateY(-26px) rotate(8deg); }
}
#confetti, #fireworks { position: fixed; inset: 0; pointer-events: none; }
#confetti { z-index: 60; }
#fireworks { z-index: 59; }
#dim {
  position: fixed; inset: 0; z-index: 11; pointer-events: none;
  background: radial-gradient(circle at 50% 45%, rgba(90, 45, 70, .18), rgba(90, 45, 70, .55));
  opacity: 0; transition: opacity .9s ease;
}
#dim.on { opacity: 1; }
#flash {
  position: fixed; inset: 0; z-index: 58; pointer-events: none;
  background: #fff; opacity: 0;
}
#flash.on { animation: flashPop .45s ease-out both; }
@keyframes flashPop { 0% { opacity: 0; } 12% { opacity: .85; } 100% { opacity: 0; } }

/* ============ 顶部按钮 ============ */
.topbar { position: fixed; top: 14px; right: 14px; z-index: 50; display: flex; gap: 10px; }
.mini-btn {
  width: 46px; height: 46px; border-radius: 50%; border: 3px solid #fff;
  background: var(--pink-soft); font-size: 20px; cursor: pointer;
  box-shadow: 0 4px 12px rgba(255, 143, 177, .35);
  transition: transform .15s;
}
.mini-btn:active { transform: scale(.88); }

/* ============ 场景容器 ============ */
.scene {
  position: fixed; inset: 0; z-index: 10;
  display: none; align-items: center; justify-content: center;
  padding: 24px;
}
.scene.active { display: flex; animation: sceneIn .6s ease both; }
@keyframes sceneIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }

/* ============ 按钮 ============ */
.btn {
  border: none; cursor: pointer; color: #fff; font-weight: 700;
  font-family: inherit; font-size: 20px; letter-spacing: 2px;
  padding: 14px 38px; border-radius: 999px;
  background: linear-gradient(135deg, #ff9fbe, #ff7ba0);
  box-shadow: 0 8px 0 #e56a92, 0 14px 24px rgba(229, 106, 146, .35);
  transition: transform .12s, box-shadow .12s;
}
.btn:active { transform: translateY(5px) scale(.97); box-shadow: 0 3px 0 #e56a92; }
.btn.big { font-size: 24px; padding: 18px 52px; }
.btn:disabled { filter: grayscale(.35) brightness(.95); cursor: default; }

/* ============ 通用弹跳 ============ */
.pop-in { animation: popIn .65s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes popIn {
  0% { opacity: 0; transform: scale(.3); }
  70% { opacity: 1; transform: scale(1.08); }
  100% { opacity: 1; transform: scale(1); }
}

/* ============ 场景 1 开场 ============ */
.intro-card {
  background: rgba(255, 255, 255, .88); backdrop-filter: blur(6px);
  border-radius: 44px; padding: 52px 44px; text-align: center;
  border: 4px solid #fff; max-width: 420px; width: 100%;
  box-shadow: 0 24px 60px rgba(255, 143, 177, .28);
}
.gift-emoji { font-size: 96px; animation: wiggle 1.6s ease-in-out infinite; display: inline-block; }
@keyframes wiggle {
  0%, 100% { transform: rotate(-7deg) scale(1); }
  50% { transform: rotate(7deg) scale(1.1); }
}
.intro-title { font-size: clamp(26px, 6vw, 34px); margin: 18px 0 10px; line-height: 1.35; }
.intro-sub { font-size: 16px; opacity: .75; margin-bottom: 30px; line-height: 1.8; }

/* ============ 场景 2 祝福卡点 ============ */
.wish-stage { text-align: center; width: 100%; max-width: 720px; }
.beat-lamp {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--accent); margin: 0 auto 34px;
  box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 25%, transparent);
  opacity: .35; transition: transform .1s;
}
.beat-lamp.hit { animation: lampHit .35s ease; }
@keyframes lampHit { 30% { transform: scale(1.8); opacity: 1; } }
.wish-text { min-height: 180px; display: flex; align-items: center; justify-content: center; }
.wish-text .line {
  font-size: clamp(30px, 7.5vw, 54px); font-weight: 800; line-height: 1.5;
  text-shadow: 3px 3px 0 #fff, 6px 6px 0 var(--accent);
  letter-spacing: 2px;
}
.wish-text .line .ch {
  display: inline-block;
  animation: chPop .5s cubic-bezier(.2, 1.8, .4, 1) both;
  animation-delay: var(--d);
}
@keyframes chPop {
  0% { opacity: 0; transform: translateY(34px) scale(.4) rotate(-8deg); }
  70% { opacity: 1; transform: translateY(-6px) scale(1.12) rotate(2deg); }
  100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
}
.wish-text .line.gold { color: #ff9fbe; }
.wish-text .line.gold .ch { text-shadow: 3px 3px 0 #fff, 6px 6px 0 var(--lemon); }
.heart-pop {
  position: fixed; z-index: 40; pointer-events: none; font-size: 24px;
  animation: heartUp 1.4s ease-out both;
}
@keyframes heartUp {
  0% { opacity: 0; transform: translateY(0) scale(.5); }
  25% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-160px) scale(1.3) rotate(var(--r, 15deg)); }
}

/* ============ 场景 3 照片卡点 ============ */
.photo-stage { text-align: center; width: 100%; max-width: 480px; position: relative; }
.count-num {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: clamp(70px, 20vw, 120px); font-weight: 900; color: #ff7ba0;
  text-shadow: 4px 4px 0 #fff, 8px 8px 0 var(--pink-soft);
  z-index: 5; pointer-events: none; opacity: 0;
}
.count-num.show { animation: countPop .55s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes countPop { 0% { opacity: 0; transform: scale(2.2); } 60% { opacity: 1; transform: scale(.95); } 100% { opacity: 0; transform: scale(1); } }
.polaroid {
  background: #fff; padding: 16px 16px 8px; border-radius: 22px;
  box-shadow: 0 22px 50px rgba(120, 80, 100, .22);
  border: 3px solid #fff; transform: rotate(-2.5deg);
  transition: transform .3s;
}
.polaroid.tilt-r { transform: rotate(2.5deg); }
.polaroid img {
  width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block;
  border-radius: 14px; background: var(--pink-soft);
}
.polaroid img.zoom-in, .letter.zoom-in { animation: photoPop .5s cubic-bezier(.2, 1.5, .4, 1) both; }
@keyframes photoPop {
  0% { transform: scale(.72); filter: brightness(1.6); }
  100% { transform: scale(1); filter: brightness(1); }
}
/* 信纸贺卡 */
.letter {
  position: relative; width: 100%; aspect-ratio: 3/4; border-radius: 14px;
  background: linear-gradient(165deg, #fffdf9, #fff2ef);
  border: 2px dashed #ffc9d6;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding: 18px; overflow: hidden;
}
.letter::before, .letter::after {
  content: '❀'; position: absolute; font-size: 18px; color: #ffc9d6;
}
.letter::before { top: 8px; left: 12px; }
.letter::after { bottom: 8px; right: 12px; transform: rotate(180deg); }
.letter-stamp {
  position: absolute; top: 12px; right: 14px;
  font-size: 12px; font-weight: 800; color: #ff8fb1;
  border: 2px solid #ffb7cb; border-radius: 8px; padding: 3px 8px;
  transform: rotate(9deg); background: #fff; letter-spacing: 1px;
}
.letter-emoji { font-size: 58px; line-height: 1; }
.letter-title {
  font-size: clamp(22px, 6vw, 28px); font-weight: 900; color: #ff6f9c;
  letter-spacing: 3px;
}
.letter-text {
  font-size: clamp(15px, 4vw, 18px); color: #7a6672; line-height: 1.9;
  text-align: center; font-weight: 600; letter-spacing: 1px;
}
.polaroid-caption {
  font-size: 17px; font-weight: 700; padding: 12px 4px 8px; letter-spacing: 1px;
}
.dots { margin-top: 26px; display: flex; gap: 9px; justify-content: center; }
.dots i {
  width: 11px; height: 11px; border-radius: 50%; background: #fff;
  box-shadow: inset 0 0 0 2px var(--pink); transition: all .25s;
}
.dots i.on { background: var(--pink); transform: scale(1.35); }

/* ============ 场景 3.5 开盲盒 ============ */
.box-stage {
  position: relative; text-align: center; width: 100%; max-width: 460px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.box-hint {
  font-size: 17px; font-weight: 700; opacity: .8; margin-bottom: 42px;
  animation: hintBounce 1.4s ease-in-out infinite; transition: opacity .3s;
}
@keyframes hintBounce { 50% { transform: translateY(-8px); } }
.box {
  position: relative; width: 190px; height: 168px; cursor: pointer;
  animation: boxIdle 2.4s ease-in-out infinite;
}
@keyframes boxIdle { 50% { transform: translateY(-10px) rotate(1.5deg); } }
.box-body {
  position: absolute; bottom: 0; left: 0; width: 190px; height: 122px;
  border-radius: 18px; background: linear-gradient(160deg, #ffa8c4, #ff6f9c);
  box-shadow: 0 16px 30px rgba(229, 106, 146, .42), inset 0 -6px 0 rgba(0, 0, 0, .06);
}
.box-body::before { /* 竖丝带 */
  content: ''; position: absolute; left: 50%; transform: translateX(-50%);
  top: 0; width: 28px; height: 100%; background: #fff; border-radius: 7px;
}
.box-body::after { /* 横丝带 */
  content: ''; position: absolute; top: 50%; transform: translateY(-50%);
  left: 0; height: 24px; width: 100%; background: #ffd35c;
}
.box-lid {
  position: absolute; top: 8px; left: -8px; width: 206px; height: 46px;
  border-radius: 14px; background: linear-gradient(160deg, #ffbcd1, #ff7ba0);
  box-shadow: 0 8px 14px rgba(229, 106, 146, .35); z-index: 2;
}
.box-lid::before {
  content: ''; position: absolute; left: 50%; transform: translateX(-50%);
  top: 0; width: 28px; height: 100%; background: #fff; border-radius: 7px;
}
.bow {
  position: absolute; top: -32px; left: 50%; transform: translateX(-50%);
  width: 100px; height: 42px; z-index: 3;
}
.bow::before, .bow::after {
  content: ''; position: absolute; top: 4px; width: 46px; height: 40px;
  border-radius: 50%; background: linear-gradient(160deg, #ffe08a, #ffc233);
  box-shadow: 0 3px 6px rgba(0, 0, 0, .12);
}
.bow::before { left: 0; transform: rotate(-18deg); }
.bow::after { right: 0; transform: rotate(18deg); }
.bow .knot {
  position: absolute; left: 50%; top: 16px; transform: translateX(-50%);
  width: 24px; height: 24px; border-radius: 50%; background: #ffbe2e; z-index: 4;
}
/* 爆开动画 */
.box.squash { animation: boxSquash .46s cubic-bezier(.3, 0, .2, 1) both; }
@keyframes boxSquash {
  0% { transform: scale(1, 1); }
  45% { transform: scale(1.38, .58) translateY(26px); }
  72% { transform: scale(.84, 1.2) translateY(-8px); }
  100% { transform: scale(1.55, .68) translateY(16px); }
}
.box.boom { animation: none; }
.box.boom .box-body { animation: bodyBoom .5s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes bodyBoom {
  0% { transform: scale(1.55, .68); opacity: 1; }
  35% { transform: scale(1.9, 1.25); opacity: 1; }
  100% { transform: scale(2.6, .35); opacity: 0; }
}
.box.boom .box-lid { animation: lidFly .75s cubic-bezier(.2, .8, .4, 1) both; }
@keyframes lidFly {
  0% { transform: translate(0, 0) rotate(0); opacity: 1; }
  100% { transform: translate(34px, -200px) rotate(70deg); opacity: 0; }
}
.box.boom .bow { animation: bowPop .45s ease-out both; }
@keyframes bowPop {
  0% { transform: translateX(-50%) scale(1); opacity: 1; }
  100% { transform: translateX(-50%) scale(1.9) translateY(-46px); opacity: 0; }
}
.shock {
  position: absolute; left: 50%; top: 46%; width: 130px; height: 130px;
  margin: -65px 0 0 -65px; border-radius: 50%;
  border: 7px solid rgba(255, 255, 255, .95); pointer-events: none;
  animation: shock .65s ease-out both;
}
@keyframes shock { 0% { transform: scale(.2); opacity: 1; } 100% { transform: scale(4.6); opacity: 0; } }
.shock.gold { border-color: #ffd98a; border-width: 9px; box-shadow: 0 0 40px rgba(255, 210, 110, .8), inset 0 0 40px rgba(255, 210, 110, .5); }
.shard {
  position: absolute; left: 50%; top: 46%; width: 14px; height: 14px;
  pointer-events: none; animation: shardFly .85s cubic-bezier(.2, .7, .3, 1) both;
}
@keyframes shardFly {
  0% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; }
  100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(.25) rotate(var(--r)); opacity: 0; }
}
/* 爆开后的彩字 */
.big-text {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
  opacity: 0; pointer-events: none; transition: opacity .9s ease;
}
.big-text.show { opacity: 1; }
.bt-top, .bt-name, .bt-wish {
  background: linear-gradient(90deg, #ff8fb1, #ffd35c, #7ecda0, #66c7c5, #ac8fe7, #ff8fb1);
  background-size: 300% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: rainbow 4s linear infinite;
  filter: drop-shadow(0 3px 0 rgba(255, 255, 255, .95)) drop-shadow(0 8px 14px rgba(120, 60, 90, .25));
}
@keyframes rainbow { to { background-position: 300% 0; } }
.bt-top { font-size: clamp(12px, 3.2vw, 17px); font-weight: 800; letter-spacing: 5px; animation-delay: -.4s; margin-bottom: 6px; }
.bt-name { font-size: clamp(38px, 11vw, 66px); font-weight: 900; letter-spacing: 4px; }
.bt-wish { font-size: clamp(28px, 8.5vw, 50px); font-weight: 900; letter-spacing: 8px; animation-delay: -1.6s; }
.gift-en {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: "Snell Roundhand", "Segoe Script", "Brush Script MT", "Quicksand", cursive;
  font-style: italic; font-weight: 700; color: #ff7ba0;
  font-size: clamp(24px, 6.5vw, 38px); letter-spacing: 1px;
  text-shadow: 3px 3px 0 #fff, 0 10px 20px rgba(255, 123, 160, .3);
  opacity: 0; pointer-events: none; transition: opacity .9s ease;
  padding: 0 20px; text-align: center; line-height: 1.5;
}
.gift-en.show { opacity: 1; }

/* ============ 场景 4 九宫格抽礼物 ============ */
.gift-stage { text-align: center; width: 100%; max-width: 460px; }
.gift-title { font-size: clamp(26px, 6vw, 34px); margin-bottom: 8px; }
.gift-sub { font-size: 15px; opacity: .7; line-height: 1.8; margin-bottom: 22px; }
#gift-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
  width: min(88vw, 380px); margin: 0 auto 30px;
}
.cell {
  position: relative; aspect-ratio: 1/1; border-radius: 22px; overflow: hidden;
  border: 4px solid #fff; cursor: pointer; background: #fff;
  box-shadow: 0 8px 20px rgba(255, 143, 177, .22);
  transition: transform .18s, box-shadow .18s, filter .18s;
  animation: popIn .5s cubic-bezier(.2, 1.6, .4, 1) both;
  animation-delay: var(--cd);
}
.cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cell.lit {
  transform: scale(1.09); z-index: 3;
  box-shadow: 0 0 0 4px var(--pink), 0 14px 30px rgba(255, 123, 160, .5);
  filter: brightness(1.08);
}
.cell.won {
  transform: scale(1.12); z-index: 3;
  box-shadow: 0 0 0 5px #ffcf5c, 0 16px 34px rgba(255, 180, 60, .55);
  animation: winShake .5s ease 2;
}
@keyframes winShake { 25% { transform: scale(1.12) rotate(-3deg); } 75% { transform: scale(1.12) rotate(3deg); } }
.cell .crown {
  position: absolute; top: -8px; right: -4px; font-size: 30px; z-index: 4;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.2));
}

/* ============ 揭晓仪式视频 ============ */
#scene-video { z-index: 56; background: #000; }
#scene-video.active { animation: none; }
#intro-video {
  width: 100%; height: 100%; object-fit: cover; background: #000;
  animation: videoOpen 1.1s ease both;
}
@keyframes videoOpen {
  from { clip-path: circle(0% at 50% 45%); }
  to { clip-path: circle(145% at 50% 45%); }
}
.video-vignette {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 52%, rgba(15, 5, 22, .6) 100%);
}
.video-caption {
  position: absolute; left: 0; right: 0; text-align: center; z-index: 3;
  color: #fff; font-size: 18px; font-weight: 800; letter-spacing: 4px;
  text-shadow: 0 2px 14px rgba(0, 0, 0, .75), 0 0 24px rgba(255, 200, 240, .4);
  opacity: 0; pointer-events: none;
}
.cap-top { top: 14%; animation: capShow 5.5s ease 1.2s both; }
.cap-bottom { bottom: 13%; animation: capShow 4.5s ease 7.2s both; }
@keyframes capShow {
  0% { opacity: 0; transform: translateY(16px); letter-spacing: 8px; }
  22% { opacity: 1; transform: translateY(0); letter-spacing: 4px; }
  78% { opacity: 1; }
  100% { opacity: 0; }
}
#video-fade {
  position: absolute; inset: 0; background: #fff; opacity: 0;
  transition: opacity 1s ease; pointer-events: none; z-index: 4;
}
#video-fade.on { opacity: 1; }

/* ============ 烫金礼券 ============ */
.overlay {
  position: fixed; inset: 0; z-index: 55;
  background: rgba(120, 70, 95, .45); backdrop-filter: blur(5px);
  display: flex; padding: 18px 16px; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.overlay.hidden { display: none; }
.coupon-stage {
  position: relative; display: flex; flex-direction: column; align-items: center;
  max-width: 330px; width: 100%; margin: auto; perspective: 900px;
  flex-shrink: 0;
}
.coupon-glow {
  position: absolute; top: 42%; left: 50%; width: 340px; height: 340px;
  margin: -170px 0 0 -170px; border-radius: 50%; pointer-events: none;
  background: conic-gradient(from 0deg, rgba(255,214,110,0), rgba(255,214,110,.85),
    rgba(255,143,177,.45), rgba(126,205,158,.4), rgba(255,214,110,.85), rgba(255,214,110,0));
  filter: blur(24px); opacity: .5;
  animation: glowSpin 7s linear infinite;
}
@keyframes glowSpin { to { transform: rotate(360deg); } }
.coupon {
  position: relative; width: 100%;
  background: linear-gradient(170deg, #fff 0%, #fff8ec 100%);
  border: 3px solid #ffd98a; border-radius: 26px; padding: 14px 14px 12px;
  box-shadow: 0 20px 44px rgba(110, 55, 15, .38), 0 0 0 6px rgba(255, 217, 138, .22);
  animation: flipIn .85s cubic-bezier(.2, 1.35, .4, 1) both;
}
@keyframes flipIn {
  0% { transform: rotateY(88deg) scale(.55); opacity: 0; }
  100% { transform: rotateY(0) scale(1); opacity: 1; }
}
.coupon > * { animation: fadeUp .55s ease both; }
.coupon-ribbon {
  display: inline-block; background: linear-gradient(135deg, #ffb1c9, #ff8fb1);
  color: #fff; font-weight: 800; padding: 6px 20px; border-radius: 999px;
  letter-spacing: 3px; font-size: 15px;
  box-shadow: 0 4px 10px rgba(255, 143, 177, .45);
  animation-delay: .4s !important;
}
.coupon-img {
  border-radius: 16px; overflow: hidden; border: 4px solid #fff;
  box-shadow: 0 8px 20px rgba(150, 100, 60, .28);
  transform: rotate(-1.4deg); margin: 11px 0 10px;
  animation-delay: .55s !important;
}
.coupon-img img {
  width: 100%; height: auto; max-height: min(36vh, 290px);
  object-fit: contain; display: block; background: #fff;
}
.coupon-name {
  font-size: 22px; font-weight: 900; color: #ff6f9c; letter-spacing: 1px;
  animation-delay: .75s !important;
}
.coupon-word {
  font-size: 14px; opacity: .72; margin-top: 2px; line-height: 1.55;
  animation-delay: .95s !important;
}
.coupon-foot {
  display: flex; justify-content: space-between; align-items: center;
  gap: 8px; font-size: 11px; color: #bb9a63; font-weight: 700; margin-top: 8px;
  animation-delay: 1.15s !important;
}
.coupon-tear {
  border-top: 2px dashed #ecd9b4; margin: 10px -2px 0;
  animation-delay: 1.25s !important;
}
.result-btns {
  display: flex; justify-content: center; margin-top: 16px;
  animation: fadeUp .55s ease 1.4s both;
}
.result-btns .btn { font-size: 19px; padding: 13px 32px; }
.share-tip {
  font-size: 13px; color: #c76a8f; line-height: 1.7; margin-top: 12px;
  animation: hintBounce 1.6s ease-in-out 1.8s infinite !important;
}
.share-tip.hidden { display: none; }
.breath { animation: breathGlow 2.2s ease-in-out 2s infinite !important; }
@keyframes breathGlow {
  0%, 100% { box-shadow: 0 8px 0 #e56a92, 0 14px 24px rgba(229, 106, 146, .35); }
  50% { box-shadow: 0 8px 0 #e56a92, 0 0 30px rgba(255, 200, 120, .9); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: none; }
}
.cell-fly { margin: 0 !important; animation: none !important; cursor: default; }

/* ============ 小屏适配 ============ */
@media (max-width: 420px) {
  .wish-text { min-height: 150px; }
  .polaroid { padding: 12px 12px 6px; }
}

/* ===================== 音频引擎（Web Audio 合成） ===================== */
let actx = null, master = null, noiseBuf = null, muted = false;

function initAudio() {
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain();
  master.gain.value = 0.9;
  master.connect(actx.destination);
  const len = actx.sampleRate;
  noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
}

function tone(t, freq, dur, { type = "triangle", vol = 0.2, glide = null } = {}) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (glide) o.frequency.exponentialRampToValueAtTime(glide, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}

function bell(t, freq, vol = 0.26) {
  tone(t, freq, 0.55, { type: "sine", vol });
  tone(t, freq * 2, 0.28, { type: "sine", vol: vol * 0.35 });
}
function kick(t, vol = 0.42) { tone(t, 150, 0.16, { type: "sine", vol, glide: 45 }); }
function hat(t, vol = 0.1) {
  if (!actx) return;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 6500;
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t + 0.08);
}
function sparkle(t) { // 上升小琶音（照片切换）
  [880, 1108, 1318, 1760].forEach((f, i) =>
    tone(t + i * 0.045, f, 0.2, { type: "sine", vol: 0.15 }));
}
function cheer(t) { // 欢呼声
  if (!actx) return;
  const s = actx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = actx.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.6;
  f.frequency.setValueAtTime(500, t);
  f.frequency.exponentialRampToValueAtTime(3200, t + 0.45);
  f.frequency.exponentialRampToValueAtTime(900, t + 0.9);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.3, t + 0.1);
  g.gain.linearRampToValueAtTime(0.0001, t + 1);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t + 1.05);
}
/* 礼盒压缩：紧张感上升滑音 */
function tension(t, dur) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
  o.type = "sawtooth";
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(1000, t + dur);
  f.type = "lowpass"; f.frequency.setValueAtTime(500, t);
  f.frequency.linearRampToValueAtTime(3200, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.16, t + dur * 0.85);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.12);
  o.connect(f); f.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.25);
}
/* 礼盒爆开：低频轰 + 噪声爆 */
function boom(t) {
  if (!actx) return;
  tone(t, 95, 0.55, { type: "sine", vol: 0.55, glide: 32 });
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = "lowpass";
  f.frequency.setValueAtTime(2600, t);
  f.frequency.exponentialRampToValueAtTime(180, t + 0.65);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.45, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.75);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t + 0.85);
}
/* 烟花升空 + 绽开声 */
function rocket(t) {
  if (!actx) return;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 4;
  f.frequency.setValueAtTime(700, t);
  f.frequency.exponentialRampToValueAtTime(2600, t + 0.35);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.12, t + 0.2);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t + 0.45);
}
function popFire(t) { // 烟花绽开
  if (!actx) return;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = "highpass";
  f.frequency.setValueAtTime(900, t);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.3, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t + 0.4);
}
function setMaster(vol, ramp = 0.4) {
  if (!master || muted) return;
  master.gain.cancelScheduledValues(actx.currentTime);
  master.gain.setValueAtTime(master.gain.value, actx.currentTime);
  master.gain.linearRampToValueAtTime(vol, actx.currentTime + ramp);
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);

/* 《生日快乐》旋律 [MIDI 音高, 时值(拍)] —— 3/4 拍，每句 6 拍 */
const SONG = [
  [67, .5], [67, .5], [69, 1], [67, 1], [72, 1], [71, 2],
  [67, .5], [67, .5], [69, 1], [67, 1], [74, 1], [72, 2],
  [67, .5], [67, .5], [79, 1], [76, 1], [72, 1], [71, 1], [69, 2],
  [79, .5], [79, .5], [77, 1], [76, 1], [72, 1], [74, 1], [72, 2],
];

/* ===================== 时间轴总指挥 ===================== */
let audioStart = 0, perfStart = 0;
const TL = [];
const at = (beat, fn) => TL.push({ beat, fn, done: false });

function startShow() {
  initAudio();
  if (actx.state === "suspended") actx.resume();
  audioStart = actx.currentTime + 0.2;
  perfStart = performance.now() + (audioStart - actx.currentTime) * 1000;

  buildTimeline();
  scheduleSong(4, false);   // 第一遍：柔和版，伴祝福文字
  scheduleSong(24, true);   // 第二遍：带鼓点，伴照片卡点
  requestAnimationFrame(loop);
}

function buildTimeline() {
  let b = 0;
  at(b++, () => showScene("scene-wish"));
  CONFIG.wishes.forEach((_, i) => at(4 + i * 2, () => showWish(i)));
  at(20, () => showScene("scene-photo"));
  at(21, () => showCount("3"));
  at(22, () => showCount("2"));
  at(23, () => showCount("1"));
  at(24, () => showCount("叮咚!"));
  for (let i = 0; i < CONFIG.photoCount; i++)
    at(25 + i * 2, () => showCard(i));
  at(25 + CONFIG.photoCount * 2 + 1, () => enterBox());
}

function loop(now) {
  const beat = (now - perfStart) / CONFIG.beatMs;
  for (const ev of TL)
    if (!ev.done && beat >= ev.beat) { ev.done = true; try { ev.fn(); } catch (e) { console.error(e); } }
  requestAnimationFrame(loop);
}

/* 音乐调度：从 startBeat 拍起播 2 遍，可带鼓点 */
function scheduleSong(startBeat, drums) {
  let b = startBeat;
  for (let rep = 0; rep < 2; rep++) {
    const songStart = b;
    for (const [m, d] of SONG) {
      const t = audioStart + b * (CONFIG.beatMs / 1000);
      const dur = d * (CONFIG.beatMs / 1000) * 0.92;
      if (drums) { hat(t, 0.07); if (d >= 1) kick(t, 0.2); }
      tone(t, midi(m), dur, { type: "triangle", vol: 0.2 });
      tone(t, midi(m) * 2, dur * 0.7, { type: "sine", vol: 0.05 });
      b += d;
    }
    for (let bb = songStart; bb < b; bb += 3) { // 低音：每小节 1 个
      const f = Math.round((bb - songStart) / 3) % 2 ? 98 : 130.81; // G2 / C3
      tone(audioStart + bb * (CONFIG.beatMs / 1000), f, CONFIG.beatMs / 1000 * 2.4,
        { type: "sine", vol: 0.22 });
    }
    b += 2; // 每遍之间小休止
  }
}

/* ===================== 烟花特效 ===================== */
const fw = $("fireworks"), fwx = fw.getContext("2d");
let fwParts = [], fwRockets = [];
function sizeFireworks() { fw.width = innerWidth; fw.height = innerHeight; }
addEventListener("resize", sizeFireworks); sizeFireworks();

/* 窜天猴：从屏幕底部带火花尾巴窜上天，到顶炸开 */
function shootRocket(tx, ty) {
  const sx = tx + (Math.random() - 0.5) * 110;
  const sy = fw.height + 12;
  const frames = 40 + Math.round(Math.random() * 16);
  fwRockets.push({
    x: sx, y: sy, tx, ty,
    vx: (tx - sx) / frames,
    vy: (ty - sy) / frames,
    life: frames,
  });
  rocket(actx.currentTime);
}
/* 连环窜天猴：连续快速发射 */
function rocketBarrage(n = 4, gap = 260) {
  for (let k = 0; k < n; k++) {
    setTimeout(() => {
      shootRocket(
        innerWidth * (0.18 + Math.random() * 0.64),
        innerHeight * (0.12 + Math.random() * 0.3)
      );
    }, k * gap);
  }
}

const FW_COLORS = ["#ff5c8a", "#ffd35c", "#6ee7b7", "#7dd3fc", "#c4b5fd", "#ff9f68", "#ffffff"];
function spawnFirework(cx, cy) {
  const col = FW_COLORS[Math.floor(Math.random() * (FW_COLORS.length - 1))];
  const n = 62 + Math.floor(Math.random() * 26);
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * Math.PI * 2 + Math.random() * 0.1;
    const sp = 2.6 + Math.random() * 3.4;
    fwParts.push({
      x: cx, y: cy,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      life: 60 + Math.random() * 34, max: 94,
      color: Math.random() < 0.18 ? "#ffffff" : col,
      size: 1.6 + Math.random() * 1.8,
    });
  }
}
function launchFireworks(count = 5) {
  for (let k = 0; k < count; k++) {
    setTimeout(() => {
      const cx = innerWidth * (0.16 + Math.random() * 0.68);
      const cy = innerHeight * (0.14 + Math.random() * 0.32);
      shootRocket(cx, cy);        // 窜天猴升空 → 到顶自动炸开
    }, k * 520 + Math.random() * 200);
  }
}
(function fwLoop() {
  fwx.globalCompositeOperation = "destination-out";
  fwx.fillStyle = "rgba(0,0,0,0.16)";
  fwx.fillRect(0, 0, fw.width, fw.height);
  fwx.globalCompositeOperation = "lighter";
  // 窜天猴推进
  fwRockets = fwRockets.filter((r) => {
    r.x += r.vx; r.y += r.vy; r.life -= 1;
    for (let i = 0; i < 2; i++) {   // 火花尾巴
      fwParts.push({
        x: r.x + (Math.random() - .5) * 5, y: r.y + (Math.random() - .5) * 5,
        vx: (Math.random() - .5) * .55, vy: .5 + Math.random() * .6,
        life: 10 + Math.random() * 10, max: 20,
        color: Math.random() < .5 ? "#ffd08a" : "#ff9f4a",
        size: 1.3 + Math.random() * 1.3,
      });
    }
    fwParts.push({ x: r.x, y: r.y, vx: 0, vy: 0, life: 3, max: 3, color: "#fff", size: 3.2 });
    if (r.life <= 0 || r.y <= r.ty) {
      spawnFirework(r.tx, r.ty);   // 炸开
      popFire(actx.currentTime);
      return false;
    }
    return true;
  });
  for (const p of fwParts) {
    const px = p.x, py = p.y;
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.052; p.vx *= 0.982; p.vy *= 0.982;
    p.life -= 1;
    const a = Math.max(0, p.life / p.max);
    fwx.strokeStyle = p.color;
    fwx.globalAlpha = a;
    fwx.lineWidth = p.size;
    fwx.beginPath(); fwx.moveTo(px, py); fwx.lineTo(p.x, p.y); fwx.stroke();
    fwx.globalAlpha = a * 0.75;
    fwx.beginPath(); fwx.arc(p.x, p.y, p.size * 0.7, 0, Math.PI * 2); fwx.fillStyle = p.color; fwx.fill();
  }
  fwx.globalAlpha = 1;
  fwx.globalCompositeOperation = "source-over";
  fwParts = fwParts.filter((p) => p.life > 0 && p.y < fw.height + 60);
  requestAnimationFrame(fwLoop);
})();

/* ===================== 九宫格抽礼物 ===================== */
let drawing = false, lastWinner = -1;

function enterGift() {
  showScene("scene-gift");

function buildGrid() {
  const grid = $("gift-grid");
  grid.innerHTML = "";
  for (let i = 0; i < CONFIG.photoCount; i++) {
    const c = document.createElement("div");
    c.className = "cell";

    c.innerHTML = `<img src="${GIFT_DATA[i]}" alt="礼物${i + 1}">`;
    grid.appendChild(c);

function buildPath(target) {
  const steps = [];
  let i = 0, delay = 65, n = 0;
  const minSteps = 18 + Math.floor(Math.random() * 7);
  for (;;) {
    steps.push({ idx: i, delay });
    if (n >= minSteps && i === target) break;
    i = (i + 1) % CONFIG.photoCount;
    delay = Math.min(320, delay * 1.17);
    n++;
  }
  return steps;
}

async function runDraw() {
  if (drawing) return;
  drawing = true;
  $("btn-draw").disabled = true;
  const cells = [...document.querySelectorAll("#gift-grid .cell")];
  if (lastWinner >= 0) cells[lastWinner].classList.remove("won"),
    cells[lastWinner].querySelector(".crown")?.remove();

  /* ① 揭晓视频：在用户点击的手势内立即播放，确保任何手机浏览器都会播放 */
  await playRevealVideo();

  /* ② 九宫格扫动 */
  const target = Math.floor(Math.random() * CONFIG.photoCount);
  const steps = buildPath(target);
  // 逐格点亮：节拍音随减速变化
  for (const st of steps) {
    cells.forEach((c, ci) => c.classList.toggle("lit", ci === st.idx));
    tone(actx.currentTime, 520 + (8 - st.idx) * 30, 0.12, { type: "square", vol: 0.06 });
    await new Promise((r) => setTimeout(r, st.delay));
  }
  // 揭晓
  lastWinner = target;
  cells.forEach((c) => c.classList.remove("lit"));
  const win = cells[target];
  win.classList.add("won");
  const crown = document.createElement("div");
  crown.className = "crown"; crown.textContent = "👑";
  win.appendChild(crown);
  $("btn-draw").disabled = true;

  /* —— 揭晓仪式 —— */
  const g = CONFIG.gifts[target] || {};
  await sleep(650);
  $("dim").classList.add("on");
  bell(actx.currentTime, 784);
  await sleep(550);
  // 选中格子飞向屏幕中央
  const clone = flyCellToCenter(win);
  bell(actx.currentTime + 0.15, 988);
  bell(actx.currentTime + 0.3, 1174);

  // 金光爆发

/* 选中格子放大飞向屏幕中央 */
function flyCellToCenter(cell) {
  const r = cell.getBoundingClientRect();
  const clone = cell.cloneNode(true);
  clone.classList.add("cell-fly");
  clone.classList.remove("won", "lit");
  clone.querySelector(".crown")?.remove();
  Object.assign(clone.style, {
    position: "fixed", left: r.left + "px", top: r.top + "px",
    width: r.width + "px", height: r.height + "px",
    zIndex: 70, transition: "all .8s cubic-bezier(.3,.75,.3,1)",
    boxShadow: "0 0 0 4px #ffd98a, 0 16px 44px rgba(255,190,60,.55)",
  });
  document.body.appendChild(clone);
  const size = Math.min(innerWidth * 0.44, 190);
  requestAnimationFrame(() => {
    Object.assign(clone.style, {
      left: (innerWidth - size) / 2 + "px",
      top: innerHeight * 0.42 - size / 2 + "px",
      width: size + "px", height: size + "px",
      borderRadius: "22px",
    });
  });
  return clone;
}

function doFlash() {
  const f = $("flash");

}

/* 播放揭晓视频（在点击手势内调用），结束后回到九宫格 */
function playRevealVideo() {
  return new Promise((resolve) => {
    const vid = $("intro-video");
    let finished = false, stall = 0, last = -1, timer, iv;
    const finish = () => {
      if (finished) return;
      finished = true;
      clearTimeout(timer); clearInterval(iv);
      $("video-fade").classList.remove("on");
      showScene("scene-gift");
      resolve();
    };
    vid.onended = () => {
      doFlash();
      $("video-fade").classList.add("on");
      setTimeout(finish, 500);
    };
    vid.onerror = () => finish();            // 文件找不到/格式不支持 → 立刻跳过
    timer = setTimeout(finish, 15000);       // 兜底
    showScene("scene-video");
    try { vid.currentTime = 0; } catch (e) { }
    vid.muted = false;
    // ↓ 同步调用，处于用户点击的手势栈内，手机浏览器必定允许播放
    const p = vid.play();
    if (p && p.catch) p.catch(() => {
      vid.muted = true;                      // 极端情况：降级静音播放
      const p2 = vid.play();
      if (p2 && p2.catch) p2.catch(() => finish());
    });
    // 卡住检测：约 6 秒没有任何进展就跳过，避免黑屏
    iv = setInterval(() => {
      if (vid.readyState === 0 || vid.paused || vid.currentTime === last) stall++;
      else stall = 0;
      last = vid.currentTime;
      if (stall >= 5) finish();
    }, 1200);
  });
}

  const price = g.price ? " " + g.price : "";
  try {
    if (!navigator.share) throw new Error("no-share");
    const blob = await (await fetch($("result-img").src)).blob();
    const file = new File([blob], "gift-" + (lastWinner + 1) + ".jpg",
      { type: blob.type || "image/jpeg" });
    if (!navigator.canShare || !navigator.canShare({ files: [file] }))
      throw new Error("no-files");
    await navigator.share({
      files: [file],
      title: "🎂 曾柯玥的生日礼物",
      text: `我抽中了「${name}」${price} ✨`,
    });
    bell(actx.currentTime, 1174);
  } catch (e) {
    if (e && e.name === "AbortError") return; // 用户主动取消
    // 当前环境不支持直接分享图片 → 提示长按图片保存后转发
    $("share-tip").classList.remove("hidden");
    bell(actx.currentTime, 659);
  }
}

/* ===================== 彩带粒子 ===================== */
const cvs = $("confetti"), cctx = cvs.getContext("2d");
let parts = [];
function sizeCanvas() { cvs.width = innerWidth; cvs.height = innerHeight; }
addEventListener("resize", sizeCanvas); sizeCanvas();

const CCOLORS = ["#ff8fb1", "#ffd35c", "#7ecda0", "#66c7c5", "#ac8fe7", "#ffb26b", "#aec6f5"];
const GOLD = ["#ffd98a", "#ffc233", "#ffe9b0", "#ff9fbe", "#fff2cc", "#f5a623"];
function burstConfetti(n = 160, colors = CCOLORS) {
  for (let k = 0; k < n; k++) {
    parts.push({
      x: innerWidth / 2 + (Math.random() - 0.5) * 160,
      y: innerHeight * 0.38,
      vx: (Math.random() - 0.5) * 16,
      vy: -6 - Math.random() * 11,
      g: 0.22 + Math.random() * 0.12,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.3,
      w: 8 + Math.random() * 7, h: 5 + Math.random() * 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      round: Math.random() < 0.3,
    });
  }
}
(function confettiLoop() {
  cctx.clearRect(0, 0, cvs.width, cvs.height);
  parts = parts.filter((p) => p.y < cvs.height + 40);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.99; p.rot += p.vr;
    cctx.save();
    cctx.translate(p.x, p.y); cctx.rotate(p.rot);
    cctx.fillStyle = p.color;
    if (p.round) { cctx.beginPath(); cctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); cctx.fill(); }
    else cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    cctx.restore();
  }
  requestAnimationFrame(confettiLoop);
})();

/* ================= 时间验证（农历九月十六解锁） ================= */
(function () {
  // 农历九月十六对应的公历日期（已精确换算，2026-2035）
  var L916 = [
    "2026-10-25", "2027-10-15", "2028-11-02", "2029-10-23", "2030-10-12",
    "2031-10-31", "2032-10-19", "2033-10-08", "2034-10-27", "2035-10-16"
  ];
  var gate = document.getElementById("gate");
  if (!gate) return;
  function unlock() { gate.classList.add("off"); }
  // 预览后门：网址末尾加 ?preview 可直接查看（方便自己确认页面）
  if (location.search.indexOf("preview") >= 0) { unlock(); return; }

  function ymd(d) {
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) +
           "-" + ("0" + d.getDate()).slice(-2);
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  var now = new Date();
  if (L916.indexOf(ymd(now)) >= 0) { unlock(); return; }   // 就是今天 → 直接放行

  var target = null;
  for (var i = 0; i < L916.length; i++) {
    var t = new Date(L916[i] + "T00:00:00");
    if (t.getTime() > now.getTime()) { target = t; break; }
  }
  if (!target) { unlock(); return; }                        // 兜底：找不到就放行

  var dEl = document.getElementById("g-d"), tEl = document.getElementById("g-t");
  function tick() {
    var diff = target.getTime() - new Date().getTime();
    if (diff <= 0) { unlock(); return; }                    // 到点自动解锁
    var dd = Math.floor(diff / 86400000);
    var hh = Math.floor((diff % 86400000) / 3600000);
    var mm = Math.floor((diff % 3600000) / 60000);
    var ss = Math.floor((diff % 60000) / 1000);
    dEl.textContent = dd;
    tEl.textContent = pad(hh) + " : " + pad(mm) + " : " + pad(ss);
  }
  tick();
  setInterval(tick, 1000);
})();

</script>
